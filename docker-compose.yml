# Watchtower deployment:
services:
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: always
    environment:
      # Docker Engine 29 rejects the default API version 1.25 of watchtower 1.7.1
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: "--label-enable --interval 60"

  qlever-docs:
    # Switch commenting of the following two lines to run the local version with `dc up -d --build`
    #build: .
    image: ghcr.io/qlever-dev/qlever-docs:master
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
